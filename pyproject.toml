[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiotrove"
dynamic = ["version"]
description = "Composable audio dataset curation pipeline: VAD, SNR, segmentation, checkpointing"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Palak Jha", email = "palakjha916@gmail.com"}]
keywords = ["audio", "dataset", "machine-learning", "vad", "speech-processing", "data-curation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "soundfile",
    "fsspec>=2023.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
enhance = ["deepfilternet"]
s3 = ["s3fs>=2023.1.0"]
gcs = ["gcsfs>=2023.1.0"]
diarize = ["pyannote.audio>=3.1.0"]
embed-dedup = ["faiss-cpu>=1.7.4", "speechbrain>=1.0.0"]
transcribe = ["openai-whisper>=20231117"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.15.22",
    "mypy",
    "click[testing]",
    "scipy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/onepizzateam/AudioTrove"
Repository = "https://github.com/onepizzateam/AudioTrove"
"Bug Tracker" = "https://github.com/onepizzateam/AudioTrove/issues"

[project.scripts]
audiotrove = "audiotrove.cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=audiotrove --cov-report=term-missing"

[tool.coverage.run]
omit = ["audiotrove/filters/enhance.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"

[tool.setuptools.dynamic]
version = {attr = "audiotrove.__version__"}

[tool.setuptools.packages.find]
include = ["audiotrove*"]

