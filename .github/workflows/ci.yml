name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Setup conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: test
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg via conda
        run: conda install -c conda-forge ffmpeg -y
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: Install torchcodec
        run: pip install torchcodec
      - name: Run tests
        run: pytest tests/ -v --cov=audiotrove --cov-report=xml --cov-report=term-missing
      - name: Lint with ruff
        run: ruff check audiotrove/ --show-fixes
